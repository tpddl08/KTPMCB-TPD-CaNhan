# Thực hành 10.3 – chạy bộ smoke giao diện (Playwright, Selenium) và kiểm thử API (Newman).
# Các bộ này gọi trang luyện tập công khai nên chỉ chạy khi bấm "Run workflow" (tab Actions) hoặc khi thư mục liên quan thay đổi.
name: UI & API tests
on:
  workflow_dispatch:
  push:
    paths: ['playwright/**', 'java/swaglabs-selenium/**', 'postman/**']

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - name: Lưu báo cáo HTML (tải ở mục Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/

  selenium:
    runs-on: ubuntu-latest      # máy chạy GitHub có sẵn Chrome
    defaults:
      run:
        working-directory: java/swaglabs-selenium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  newman:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: postman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # TC-API-02 cố ý thất bại (bước 4 của Thực hành 2.1) nên CI chỉ chạy yêu cầu khởi động, TC-API-01 và TC-API-03
      - run: >
          npx --yes newman@6 run Lab02.postman_collection.json -e staging.postman_environment.json
          --folder "Khởi động (warm-up)" --folder "TC-API-01 – Lấy người dùng id = 1"
          --folder "TC-API-03 – Người dùng không tồn tại trả về 404 (viết lại cho đúng)"
          --reporters cli,junit --reporter-junit-export newman-results.xml
